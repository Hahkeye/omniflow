[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniflow"
version = "0.2.0"
description = "Multimodal diary: record, diarize, transcribe, and analyze conversations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Omniflow contributors" }]
keywords = ["diary", "speech", "diarization", "transcription", "whisper", "moss"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# NOTE: torch/torchaudio are intentionally NOT here.
# CUDA vs CPU wheels are arch/OS-specific and must be installed first:
#   python -m diary_app.install_torch
#   bash diary_app/setup_venv.sh
#   .\diary_app\install.ps1
dependencies = [
  "transformers>=4.49.0,<5",
  "soundfile>=0.12.0",
  "librosa>=0.10.0",
  "numpy>=1.26.0",
  "sounddevice>=0.5.0",
  "rich>=13.0.0",
  "tqdm>=4.66.0",
  "pydantic>=2.0.0",
  "av>=12.0.0",
  "safetensors>=0.4.0",
  "cryptography>=42.0.0",
  "moss-transcribe-diarize @ git+https://github.com/OpenMOSS/MOSS-Transcribe-Diarize.git@0e3d1403fd8f1f1c674e883ece96b9f630794ebe",
]

[project.optional-dependencies]
# Convenience only — wrong on many Linux CUDA hosts. Prefer install_torch.
torch = [
  "torch>=2.2.0",
  "torchaudio>=2.2.0",
]
whisper = [
  "openai-whisper",
  "whisperx",
  "pyannote.audio",
]
ui = [
  "gradio>=4.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]
# Full stack when PyPI torch is OK (macOS, or Linux CPU after install_torch)
all = [
  "omniflow[torch,dev,ui]",
]

[project.scripts]
omniflow = "diary_app.main:main"
diary-app = "diary_app.main:main"

[project.urls]
Homepage = "https://github.com/Hahkeye/omniflow"
Documentation = "https://github.com/Hahkeye/omniflow#readme"
Repository = "https://github.com/Hahkeye/omniflow"
Issues = "https://github.com/Hahkeye/omniflow/issues"

[tool.setuptools.packages.find]
include = ["diary_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
