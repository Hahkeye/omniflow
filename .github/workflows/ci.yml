name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal deps for unit tests
        run: |
          python -m pip install -U pip
          # Core pure-Python path for tests (no torch / MOSS download)
          pip install pydantic rich cryptography pytest
      - name: Run unit tests
        run: |
          pytest tests/ -q --ignore=tests/test_integration_ml.py
        env:
          PYTHONPATH: .

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diary-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: diary-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
